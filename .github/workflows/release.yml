name: release

# Triggered by:
#   - push of a v* tag         -> builds sdist+wheel, attaches to GH
#                                 release page, publishes to PyPI via
#                                 OIDC trusted publishing.
#   - manual workflow_dispatch -> can re-build and re-publish (e.g.
#                                 if a PyPI publish failed on the
#                                 original tag run). PyPI re-publish
#                                 will reject if the version already
#                                 exists, which is the desired safety.
#
# PyPI publishing requires a trusted publisher configured for
# apresence/wormlens at https://pypi.org with workflow filename
# `release.yml` and environment name `pypi`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI (requires trusted publisher configured)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  pypi-publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/wormlens/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
