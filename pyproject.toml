[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wormlens"
version = "0.1.0"
description = "Lossless episodic memory for Claude Code and VS Code Copilot"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "apresence", email = "8013838+apresence@users.noreply.github.com"},
]
keywords = ["claude", "claude-code", "copilot", "chat", "extraction", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
wl = "wormlens.cli:main"

[project.urls]
Homepage = "https://github.com/apresence/wormlens"
Repository = "https://github.com/apresence/wormlens"

[tool.setuptools.package-dir]
"wormlens" = "."
"wormlens.providers" = "providers"
"wormlens.providers.claude_code" = "providers/claude_code"
"wormlens.providers.vscode_copilot" = "providers/vscode_copilot"
"wormlens.harness" = "harness"

[tool.setuptools.packages]
find = {where = ["."], namespaces = false}
