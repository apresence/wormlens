[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wormlens"
version = "0.3.0"
description = "Lossless episodic memory for Claude Code, OpenAI Codex CLI, VS Code Copilot, and claude.ai web exports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "apresence", email = "8013838+apresence@users.noreply.github.com"},
]
keywords = ["claude", "claude-code", "copilot", "chat", "extraction", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
fast = ["orjson>=3"]
follow = ["watchdog>=3"]
tmux = ["libtmux>=0.39"]

[project.scripts]
wl = "wormlens.cli:main"

[project.urls]
Homepage = "https://github.com/apresence/wormlens"
Repository = "https://github.com/apresence/wormlens"

[tool.setuptools.package-dir]
"wormlens" = "."
"wormlens.providers" = "providers"
"wormlens.providers.claude_ai" = "providers/claude_ai"
"wormlens.providers.claude_code" = "providers/claude_code"
"wormlens.providers.codex" = "providers/codex"
"wormlens.providers.vscode_copilot" = "providers/vscode_copilot"
"wormlens.providers.wl_extract" = "providers/wl_extract"
"wormlens.harness" = "harness"
"wormlens.terminal" = "terminal"

[tool.setuptools]
packages = [
    "wormlens",
    "wormlens.providers",
    "wormlens.providers.claude_ai",
    "wormlens.providers.claude_code",
    "wormlens.providers.codex",
    "wormlens.providers.vscode_copilot",
    "wormlens.providers.wl_extract",
    "wormlens.harness",
    "wormlens.terminal",
]

[tool.setuptools.package-data]
wormlens = ["skill.md"]
"wormlens.harness" = ["wl-hook.py"]
